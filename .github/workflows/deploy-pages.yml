name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Check Vue and project code
        run: vp run check
      - name: Check Vite+ formatting, lint, and types
        run: vp check
      - name: Run tests
        run: vp test --run
      - name: Check formatting
        run: vp run fmt:check
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: vp run build -- --base "$PAGES_BASE_PATH/"
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
