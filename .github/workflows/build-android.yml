name: Build Android Debug APK

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check Vue and project code
        run: vp run check

      - name: Check Vite+ formatting, lint, and types
        run: vp check

      - name: Run tests
        run: vp test --run

      - name: Check formatting
        run: vp run fmt:check

      - name: Build web assets for Android
        run: vp run build:android

      - name: Sync Capacitor Android project
        run: vp exec cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify Debug APK exists
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: qremi-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
